<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chi tiết sản phẩm — Nếp Tóc</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="theme-color" content="#d6336c"/>
  <meta property="og:type" content="product"/>
  <meta property="og:title" content="Chi tiết sản phẩm — Nếp Tóc"/>
  <meta property="og:description" content="Phụ kiện tóc cao cấp TP.HCM — Kẹp càng cua, kẹp mái thiết kế tối giản, vật liệu an toàn không gãy rụng nếp tóc."/>
  <meta property="og:image" content="favicon.svg"/>
  <link rel="stylesheet" href="style.css?v=9"/>
</head>
<body>

<div id="site-header"></div>

<div class="page" id="detail-page">
  <div id="not-found" style="display:none; text-align:center; padding:80px 0;">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.8" style="margin: 0 auto 16px; color: var(--apple-tertiary);"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
    <h2 style="font-family:'Syne',sans-serif; font-size:24px; margin-bottom:8px;">Không tìm thấy sản phẩm</h2>
    <a href="products.html" class="btn-primary" style="display:inline-block; margin-top:16px;">Quay lại cửa hàng</a>
  </div>
  <div id="detail-content"></div>
</div>

<!-- Sticky Mobile Add to Cart Bar -->
<div class="sticky-atc-bar" id="sticky-atc-bar">
  <div class="sticky-atc-left">
    <div class="sticky-atc-thumb" id="sticky-atc-thumb">
      <svg width="28" height="28" viewBox="0 0 84 84" fill="none">
        <ellipse cx="42" cy="34" rx="30" ry="20" fill="#fafafc" stroke="#1d1d1f" stroke-width="2.5"/>
        <rect x="36" y="50" width="12" height="20" rx="6" fill="#1d1d1f"/>
      </svg>
    </div>
    <div class="sticky-atc-info">
      <div class="sticky-atc-title" id="sticky-atc-title"></div>
      <div class="sticky-atc-price" id="sticky-atc-price"></div>
    </div>
  </div>
  <button class="sticky-atc-btn" id="sticky-atc-btn">Thêm vào giỏ →</button>
</div>

<div id="site-footer"></div>
<div class="toast-container"></div>

<script src="products.js?v=9"></script>
<script src="cart.js?v=9"></script>
<script src="main.js?v=9"></script>
<script>
  // Safe helper fallbacks in case of script delay or partial load
  function safeFmt(n) {
    try {
      if (typeof fmt === 'function') return fmt(n);
    } catch (e) {}
    return (Number(n) || 0).toLocaleString('vi-VN') + 'đ';
  }

  function initDetailPage() {
    try {
      if (typeof renderHeader === 'function') renderHeader();
      if (typeof renderFooter === 'function') renderFooter();
    } catch (e) {
      console.warn('Header/Footer render error:', e);
    }

    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id'), 10);
    const prodList = (typeof PRODUCTS !== 'undefined' && Array.isArray(PRODUCTS)) ? PRODUCTS : [];
    const p = prodList.find(function(x) { return Number(x.id) === Number(id); });

    if (!p) {
      const nf = document.getElementById('not-found');
      if (nf) nf.style.display = 'block';
      return;
    }

    try {
      document.title = p.name + ' — Nếp Tóc';
    } catch (e) {}

    const discount = Math.round((1 - p.price / (p.originalPrice || p.price)) * 100);
    let selectedSwatch = (p.swatches && p.swatches[0]) ? p.swatches[0].name : 'Tiêu chuẩn';
    let qty = 1;

    function getVisualLarge() {
      try {
        if (p && p.image) {
          return '<img src="' + p.image + '" id="detail-main-img" alt="' + p.name + '" style="width:100%; height:100%; object-fit:cover; border-radius:inherit; display:block; transition:opacity 0.2s ease;" />';
        }
        if (typeof productVisualSVG === 'function') {
          return productVisualSVG(p, 200);
        }
      } catch (e) {
        console.error('getVisualLarge error:', e);
      }
      return '<svg width="200" height="200" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" fill="' + (p.cardBg || '#f5f5f7') + '" stroke="' + (p.cardAccent || '#d6336c') + '" stroke-width="2.5"/><text x="50" y="54" font-size="9" text-anchor="middle" fill="' + (p.cardAccent || '#d6336c') + '" font-weight="700">' + (p.shortName || p.name) + '</text></svg>';
    }

    function renderDetail() {
      const contentEl = document.getElementById('detail-content');
      if (!contentEl) return;

      const swatchesHTML = (p.swatches || []).map(function(s, i) {
        return '<div class="swatch-preview" data-idx="' + i + '" style="width:48px;height:48px;border-radius:10px;border:2px solid ' + (i === 0 ? 'var(--black)' : '#ddd') + ';background:' + s.color + ';cursor:pointer;transition:border-color 0.15s;" title="' + s.name + '"></div>';
      }).join('');

      const swatchesRowHTML = (p.swatches || []).map(function(s, i) {
        return '<div class="swatch-opt ' + (i === 0 ? 'selected' : '') + '" data-swatch="' + s.name + '" data-idx="' + i + '"><div class="dot" style="background:' + s.color + ';"></div>' + s.name + '</div>';
      }).join('');

      contentEl.innerHTML = `
        <div class="product-nav-bar">
          <button class="btn-back" onclick="goBack('products.html')" aria-label="Quay lại" title="Quay lại">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <div class="breadcrumb">
            <a href="index.html">Trang chủ</a> / 
            <a href="products.html">Sản phẩm</a> / 
            <a href="products.html?cat=${p.category}">${p.categoryName}</a> / 
            <span>${p.name}</span>
          </div>
        </div>
        <div class="detail-layout">
          <div>
            <div class="detail-visual" id="detail-visual-box" style="background:${p.cardBg}" onclick="openImageLightbox()" title="Nhấn để phóng to chi tiết">
              <div class="detail-tag">${p.tag}</div>
              ${getVisualLarge()}
              <div class="visual-zoom-badge">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <span>Phóng to chi tiết</span>
              </div>
            </div>
            <!-- Swatches preview -->
            <div style="display:flex; gap:8px; margin-top:12px;">
              ${swatchesHTML}
            </div>
          </div>
          <div class="detail-info">
            <div class="detail-name">${p.name}</div>
            <div class="hair-fit-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              ${p.category === 'claw' ? 'Phù hợp: Tóc vừa đến tóc dày • Búi củ tỏi Pháp & kẹp gáy' : 'Phù hợp: Mọi chất tóc • Kẹp mái tạo kiểu & kẹp nửa đầu'}
            </div>
            <div class="detail-price-row">
              <span class="detail-price">${safeFmt(p.price)}</span>
              <span class="detail-original">${safeFmt(p.originalPrice)}</span>
              <span class="detail-discount">-${discount}%</span>
            </div>
            <p class="detail-desc">${p.description}</p>

            <div class="detail-section-title">Màu sắc — <span id="swatch-label" style="font-weight:400; text-transform:none;">${selectedSwatch}</span></div>
            <div class="swatch-row" id="swatch-row">
              ${swatchesRowHTML}
            </div>

            <div class="detail-section-title">Số lượng</div>
            <div class="qty-row">
              <div class="qty-ctrl">
                <button id="qty-minus">−</button>
                <input type="number" id="qty-input" value="1" min="1" max="99"/>
                <button id="qty-plus">+</button>
              </div>
              <span style="font-size:14px; color:var(--text-muted);">Còn hàng</span>
            </div>

            <div class="detail-actions" id="main-actions-area">
              <button class="btn-buy-now" id="btn-buy-now">Mua ngay →</button>
              <button class="btn-add-detail" id="btn-add-detail">Thêm vào giỏ hàng</button>
            </div>

            <a href="studio.html" class="apple-bespoke-cta" style="display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:12px 16px; border-radius:12px; background:var(--apple-surface-secondary); border:1px solid var(--apple-border); color:var(--apple-black); font-size:13px; font-weight:600; text-decoration:none; transition:all 0.2s ease;">
              <span>Cá nhân hóa miễn phí với khắc laser</span>
              <span style="color:var(--apple-secondary); font-size:12px;">Thử khắc chữ →</span>
            </a>

            <div class="trust-badges-box">
              <div class="trust-badge-item">
                <div class="trust-badge-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div>
                  <div class="trust-badge-title">Lò xo thép Titan trợ lực</div>
                  <div class="trust-badge-sub">Bảo hành 1 đổi 1 trong 30 ngày nếu gãy lò xo</div>
                </div>
              </div>
              <div class="trust-badge-item">
                <div class="trust-badge-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div>
                  <div class="trust-badge-title">Cellulose Acetate bóng mịn</div>
                  <div class="trust-badge-sub">Chất liệu tự nhiên cao cấp, không gây đứt nếp tóc</div>
                </div>
              </div>
              <div class="trust-badge-item">
                <div class="trust-badge-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                </div>
                <div>
                  <div class="trust-badge-title">Giao nhanh 24h TP.HCM</div>
                  <div class="trust-badge-sub">Nội thành TP.HCM • Miễn phí đơn từ 99.000đ</div>
                </div>
              </div>
              <div class="trust-badge-item">
                <div class="trust-badge-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                </div>
                <div>
                  <div class="trust-badge-title">Đồng kiểm & Đổi trả 7 ngày</div>
                  <div class="trust-badge-sub">Kiểm tra ưng ý mới thanh toán tiền mặt (COD)</div>
                </div>
              </div>
            </div>

            <div class="detail-specs" style="margin-top:24px;">
              <p><strong>Chất liệu:</strong> ${p.material}</p>
              <p><strong>Thông số:</strong> ${p.spec}</p>
              <p><strong>Nhóm:</strong> ${p.categoryName}</p>
              <p><strong>Giao hàng:</strong> 1–2 ngày tại TP.HCM • Miễn ship đơn 99k</p>
              <p><strong>Đổi trả:</strong> 7 ngày nếu lỗi từ nhà sản xuất</p>
            </div>
          </div>
        </div>

        <!-- Mô tả chi tiết -->
        <div style="margin-top:60px; padding-top:40px; border-top:2px solid #eee;">
          <h2 class="section-title" style="margin-bottom:16px;">Mô tả <em>chi tiết</em></h2>
          <p style="font-size:16px; line-height:1.8; color:#444; max-width:720px;">${p.longDesc}</p>
        </div>

        <!-- Sản phẩm liên quan -->
        <div style="margin-top:60px; padding-top:40px; border-top:2px solid #eee;">
          <h2 class="section-title" style="margin-bottom:8px;">Có thể <em>bạn thích</em></h2>
          <p class="section-sub" style="margin-bottom:28px;">Cùng nhóm ${p.categoryName}</p>
          <div class="product-grid" id="related-grid"></div>
        </div>
      `;

      // Swatch interactions
      document.querySelectorAll('.swatch-opt').forEach(function(opt) {
        opt.addEventListener('click', function() {
          document.querySelectorAll('.swatch-opt').forEach(function(o) { o.classList.remove('selected'); });
          opt.classList.add('selected');
          selectedSwatch = opt.getAttribute('data-swatch');
          const lbl = document.getElementById('swatch-label');
          if (lbl) lbl.textContent = selectedSwatch;
          // Sync preview dots
          const idx = parseInt(opt.getAttribute('data-idx'), 10);
          document.querySelectorAll('.swatch-preview').forEach(function(d, i) {
            d.style.borderColor = (i === idx) ? 'var(--black)' : '#ddd';
          });
          // Update photo if swatch has its own photo
          if (p.swatches && p.swatches[idx] && p.swatches[idx].image) {
            const mainImg = document.getElementById('detail-main-img');
            if (mainImg) {
              mainImg.style.opacity = '0.4';
              setTimeout(function() {
                mainImg.src = p.swatches[idx].image;
                mainImg.style.opacity = '1';
              }, 120);
            }
          }
        });
      });

      // Swatch preview dots sync
      document.querySelectorAll('.swatch-preview').forEach(function(dot, i) {
        dot.addEventListener('click', function() {
          const opts = document.querySelectorAll('.swatch-opt');
          if (opts && opts[i]) {
            opts[i].click();
          }
        });
      });

      // Qty controls
      const qtyInput = document.getElementById('qty-input');
      const minusBtn = document.getElementById('qty-minus');
      const plusBtn = document.getElementById('qty-plus');
      if (minusBtn && qtyInput) {
        minusBtn.addEventListener('click', function() {
          qty = Math.max(1, qty - 1);
          qtyInput.value = qty;
        });
      }
      if (plusBtn && qtyInput) {
        plusBtn.addEventListener('click', function() {
          qty = Math.min(99, qty + 1);
          qtyInput.value = qty;
        });
      }
      if (qtyInput) {
        qtyInput.addEventListener('change', function() {
          qty = Math.min(99, Math.max(1, parseInt(qtyInput.value, 10) || 1));
          qtyInput.value = qty;
        });
      }

      // Add to cart
      const addBtn = document.getElementById('btn-add-detail');
      if (addBtn) {
        addBtn.addEventListener('click', function() {
          if (typeof addToCart === 'function') {
            addToCart(p.id, qty, selectedSwatch);
          }
          if (typeof showToast === 'function') {
            showToast('Đã thêm vào giỏ hàng');
          }
        });
      }

      // Buy now
      const buyBtn = document.getElementById('btn-buy-now');
      if (buyBtn) {
        buyBtn.addEventListener('click', function() {
          if (typeof addToCart === 'function') {
            addToCart(p.id, qty, selectedSwatch);
          }
          location.href = 'checkout.html';
        });
      }

      // Related products
      try {
        const related = prodList.filter(function(x) { return x.category === p.category && Number(x.id) !== Number(p.id); }).slice(0, 3);
        const relGrid = document.getElementById('related-grid');
        if (relGrid) {
          if (typeof productCardHTML === 'function') {
            relGrid.innerHTML = related.map(productCardHTML).join('');
          } else {
            relGrid.innerHTML = related.map(function(r) {
              return '<a href="product-detail.html?id=' + r.id + '" class="product-card"><div class="product-info"><div class="product-name">' + r.name + '</div><div class="product-price">' + safeFmt(r.price) + '</div></div></a>';
            }).join('');
          }
        }
      } catch (relErr) {
        console.warn('Related products error:', relErr);
      }

      // Setup Sticky Mobile Add-to-Cart Bar
      try {
        const stickyBar = document.getElementById('sticky-atc-bar');
        const stickyTitle = document.getElementById('sticky-atc-title');
        const stickyPrice = document.getElementById('sticky-atc-price');
        const stickyBtn = document.getElementById('sticky-atc-btn');

        if (stickyBar && stickyTitle && stickyPrice && stickyBtn) {
          stickyTitle.textContent = p.name;
          stickyPrice.textContent = safeFmt(p.price);

          stickyBtn.addEventListener('click', function() {
            if (typeof addToCart === 'function') {
              addToCart(p.id, qty, selectedSwatch);
            }
            if (typeof showToast === 'function') {
              showToast('Đã thêm vào giỏ: ' + p.name);
            }
            if (typeof openCartDrawer === 'function') {
              openCartDrawer();
            }
          });

          const targetArea = document.getElementById('main-actions-area');
          if (targetArea && 'IntersectionObserver' in window) {
            const observer = new IntersectionObserver(function(entries) {
              entries.forEach(function(entry) {
                if (!entry.isIntersecting && entry.boundingClientRect.top < 0) {
                  stickyBar.classList.add('visible');
                  document.body.classList.add('has-sticky-atc');
                } else {
                  stickyBar.classList.remove('visible');
                  document.body.classList.remove('has-sticky-atc');
                }
              });
            }, { threshold: 0 });
            observer.observe(targetArea);
          }
        }
      } catch (stickyErr) {
        console.warn('Sticky bar error:', stickyErr);
      }
    }

    try {
      renderDetail();
    } catch (renderError) {
      console.error('Critical render error in product-detail:', renderError);
      const container = document.getElementById('detail-content');
      if (container) {
        container.innerHTML = `
          <div class="product-nav-bar">
            <button class="btn-back" onclick="goBack('products.html')" aria-label="Quay lại">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>
            <div class="breadcrumb">
              <a href="index.html">Trang chủ</a> / <a href="products.html">Sản phẩm</a> / <span>${p.name}</span>
            </div>
          </div>
          <div style="padding: 24px; background:#fff; border-radius:18px; border:1px solid #eee; margin-top:16px;">
            <h1 style="font-size:24px; font-weight:700; margin-bottom:12px;">${p.name}</h1>
            <div style="font-size:26px; font-weight:700; color:var(--apple-accent,#d6336c); margin-bottom:16px;">${safeFmt(p.price)}</div>
            <p style="font-size:15px; color:#555; line-height:1.6; margin-bottom:24px;">${p.description}</p>
            <button class="btn-primary" style="width:100%; padding:14px; font-size:16px;" onclick="if(typeof addToCart==='function') addToCart(${p.id}, 1, '${(p.swatches && p.swatches[0]) ? p.swatches[0].name : ''}'); if(typeof showToast==='function') showToast('Đã thêm vào giỏ hàng'); if(typeof openCartDrawer==='function') openCartDrawer();">Thêm vào giỏ hàng (${safeFmt(p.price)})</button>
          </div>
        `;
      }
    }
  }

  // Execute reliably when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDetailPage);
  } else {
    initDetailPage();
  }

  function openImageLightbox() {
    const lb = document.getElementById('image-lightbox');
    const lbVisual = document.getElementById('lightbox-visual');
    const lbTitle = document.getElementById('lightbox-title');
    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id'), 10);
    const prodList = (typeof PRODUCTS !== 'undefined' && Array.isArray(PRODUCTS)) ? PRODUCTS : [];
    const prod = prodList.find(function(x) { return Number(x.id) === Number(id); });
    if (lb && lbVisual && prod) {
      if (lbTitle) lbTitle.textContent = prod.name;
      if (prod.image) {
        const curImg = document.getElementById('detail-main-img');
        const curSrc = (curImg && curImg.src) ? curImg.src : prod.image;
        lbVisual.innerHTML = '<img src="' + curSrc + '" alt="' + prod.name + '" style="max-width:92vw; max-height:72vh; object-fit:contain; border-radius:12px; display:block; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,0.15);" />';
      } else if (typeof productVisualSVG === 'function') {
        lbVisual.innerHTML = productVisualSVG(prod, 260);
      }
      lb.classList.add('active');
    }
  }

  function closeImageLightbox() {
    const lb = document.getElementById('image-lightbox');
    if (lb) lb.classList.remove('active');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeImageLightbox();
  });
</script>

<!-- Floating Back Button on Scroll -->
<button class="floating-back-btn" id="floating-back-btn" onclick="goBack('products.html')" aria-label="Quay lại" title="Quay lại">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
</button>

<!-- Fullscreen Image Inspection Lightbox -->
<div class="image-lightbox" id="image-lightbox" onclick="if(event.target===this) closeImageLightbox()">
  <div class="lightbox-content">
    <div class="lightbox-header">
      <button class="btn-back" onclick="closeImageLightbox()" aria-label="Quay lại" title="Đóng xem chi tiết">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="lightbox-title" id="lightbox-title">Chi tiết sản phẩm</div>
    </div>
    <div id="lightbox-visual" style="padding:20px 0;"></div>
