<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sản phẩm — SoraHome</title>
  <meta name="description" content="Danh mục dụng cụ vệ sinh nhà cửa và tiện ích gia đình thông minh SoraHome. Bảo hành 30 ngày, đổi mới 7 ngày."/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=26"/>
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=26"/>
  <link rel="apple-touch-icon" href="favicon.png?v=26"/>
  <meta name="theme-color" content="#38BDF8"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Bộ sưu tập sản phẩm — SoraHome"/>
  <meta property="og:description" content="Danh mục dụng cụ vệ sinh nhà cửa và tiện ích gia đình thông minh SoraHome. Bảo hành 30 ngày, đổi mới 7 ngày."/>
  <meta property="og:image" content="favicon.png?v=26"/>
  <link rel="stylesheet" href="style.css?v=26"/>
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div style="margin-bottom:32px;">
    <h1 class="section-title">Tất cả <em>sản phẩm</em></h1>
    <p class="section-sub">Dụng cụ vệ sinh nhà cửa thông minh — thiết kế tối giản, vật liệu bền bỉ và tiện dụng cho tổ ấm</p>
  </div>

  <!-- Search & Filter Toolbar -->
  <div class="products-toolbar">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-cat="all" id="btn-all">Tất cả</button>
      <button class="filter-btn" data-cat="floor">Lau Nhà & Sàn</button>
      <button class="filter-btn" data-cat="bathroom">Phòng Tắm & Toilet</button>
      <button class="filter-btn" data-cat="glass">Gạt Nước & Kính</button>
    </div>

    <!-- Instant Search Bar -->
    <div class="search-box">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm cây lau nhà, chà sàn 3in1, gạt nước, cọ bồn cầu..."/>
    </div>
  </div>

  <!-- Products Count & Status -->
  <div id="filter-status" style="font-size:13px; color:var(--apple-tertiary); margin-bottom:20px; font-weight:500;"></div>

  <!-- Grid -->
  <div class="product-grid" id="product-grid"></div>

  <!-- Empty Search Result -->
  <div id="empty-search" style="display:none; text-align:center; padding:64px 20px;">
    <h3 style="font-size:20px; font-weight:700; color:var(--apple-black); margin-bottom:6px;">Không tìm thấy dụng cụ phù hợp</h3>
    <p style="color:var(--apple-secondary); font-size:14px; margin-bottom:20px;">Thử tìm với từ khóa khác như "cây lau nhà", "gạt nước", "chà sàn", "cọ toilet" hoặc xem tất cả dụng cụ.</p>
    <button class="btn-primary" onclick="resetFilter()">Xem tất cả sản phẩm</button>
  </div>
</div>

<div id="site-footer"></div>
<div class="toast-container"></div>

<script src="products.js?v=27"></script>
<script src="cart.js?v=27"></script>
<script src="main.js?v=27"></script>
<script>
  renderHeader();
  renderFooter();

  const allBtn = document.getElementById('btn-all');
  if (allBtn && typeof PRODUCTS !== 'undefined') {
    allBtn.textContent = `Tất cả (${PRODUCTS.length})`;
  }

  let currentCat = 'all';
  let searchTerm = '';

  const urlParams = new URLSearchParams(location.search);
  const catParam = urlParams.get('cat');
  if (catParam) currentCat = catParam;

  const searchInput = document.getElementById('search-input');
  const gridEl = document.getElementById('product-grid');
  const emptyEl = document.getElementById('empty-search');
  const statusEl = document.getElementById('filter-status');

  function renderGrid() {
    let filtered = PRODUCTS;

    // Filter by Category
    if (currentCat !== 'all') {
      filtered = filtered.filter(p => p.category === currentCat);
    }

    // Filter by Search Keyword
    if (searchTerm.trim() !== '') {
      const term = searchTerm.toLowerCase();
      filtered = filtered.filter(p => 
        p.name.toLowerCase().includes(term) ||
        p.description.toLowerCase().includes(term) ||
        p.categoryName.toLowerCase().includes(term) ||
        (p.material && p.material.toLowerCase().includes(term))
      );
    }

    // Update Status
    if (searchTerm.trim() !== '') {
      statusEl.textContent = `Tìm thấy ${filtered.length} kết quả cho "${searchTerm}"`;
    } else {
      statusEl.textContent = `Đang hiển thị ${filtered.length} sản phẩm`;
    }

    // Handle Empty
    if (filtered.length === 0) {
      gridEl.style.display = 'none';
      emptyEl.style.display = 'block';
    } else {
      gridEl.style.display = 'grid';
      emptyEl.style.display = 'none';
      gridEl.innerHTML = filtered.map(productCardHTML).join('');
    }

    // Update active filter pill
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === currentCat);
    });
  }

  // Instant Search with direct response
  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderGrid();
  });

  // Category filter
  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    renderGrid();
  });

  function resetFilter() {
    currentCat = 'all';
    searchTerm = '';
    searchInput.value = '';
    renderGrid();
  }

  renderGrid();
</script>
</body>
</html>
