<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#d6336c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d6336c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="18" fill="#1d1d1f"/>
  <g transform="translate(32, 32)" filter="url(#softShadow)">
    <!-- Elegant Hair Clip Petals -->
    <ellipse cx="0" cy="-6" rx="14" ry="9" fill="url(#roseGrad)" opacity="0.95"/>
    <ellipse cx="-8" cy="2" rx="10" ry="7" fill="#ffffff" opacity="0.9" transform="rotate(-30 -8 2)"/>
    <ellipse cx="8" cy="2" rx="10" ry="7" fill="#ffffff" opacity="0.9" transform="rotate(30 8 2)"/>
    <!-- Center core / clasp -->
    <circle cx="0" cy="0" r="4.5" fill="#f8f9fa"/>
    <circle cx="0" cy="0" r="2.5" fill="#d6336c"/>
    <!-- Clip base teeth hint -->
    <path d="M-6 8 Q0 12 6 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
